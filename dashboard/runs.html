<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<title>Runs</title>
<style>
:root{--ink:#FFFBF1;--paper:#000;--dim:rgba(255,251,241,.6)}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);margin:0;padding:18px;padding-top:max(18px,env(safe-area-inset-top));font-size:16px;line-height:1.45}
h1{font-size:24px;margin:0 0 6px} h2{font-size:18px;margin:26px 0 10px}
a{color:var(--ink);font-weight:600} p.note{color:var(--dim);font-size:14px;margin:4px 0 10px}
.card{background:#0c0c0c;border:1px solid rgba(255,251,241,.14);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 12px 30px rgba(0,0,0,.9)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.title{font-weight:600} .meta{color:var(--dim);font-size:13px}
input,select{background:var(--paper);color:var(--ink);border:1px solid rgba(255,251,241,.22);border-radius:14px;padding:11px;font-size:16px;font-family:inherit;width:100%}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--dim);margin-bottom:10px}
.check{flex-direction:row;align-items:center;gap:8px}.check input{width:auto}
button{border:0;border-radius:14px;padding:11px 14px;font-size:15px;font-weight:600;color:var(--paper);background:linear-gradient(#FFFBF1,#d8d4c8);cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.9)}
button:disabled{opacity:.5} button.ghost{background:#0c0c0c;color:var(--ink);border:1px solid rgba(255,251,241,.3)}
.tag{display:inline-block;font-size:12px;border:1px solid rgba(255,251,241,.4);border-radius:999px;padding:2px 8px;margin-left:6px}
.blocked{border-color:#ffb020;color:#ffb020}
.msg{margin-top:8px;font-size:14px;color:var(--dim)} .msg.err{color:#ff7070;font-weight:600}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
#lock{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;padding:20px}
#lock .card{max-width:340px;width:100%}
</style></head>
<body>
<p><a href="index.html">Back to dashboard</a></p>
<h1>Runs</h1>
<p class="note">Search saved sites or any job page, and retry anything still waiting.</p>

<div id="lock" hidden><div class="card">
  <label>Dashboard password<input id="pw" type="password" autocomplete="current-password"></label>
  <button id="unlock">Open</button>
  <div class="msg err" id="lockMsg"></div>
</div></div>

<h2>Outstanding</h2>
<p class="note">Cover letters not written yet, and emails that failed. Retry runs that one item again.</p>
<div id="outstanding"><div class="msg">Loading...</div></div>

<h2>Run a search</h2>
<div class="grid">
  <div class="card">
    <label>Where to search
      <select id="mode"><option value="site">A saved site</option><option value="link">A pasted page link</option></select>
    </label>
    <div id="siteBox"><label>Saved site<select id="siteSelect"></select></label></div>
    <div id="linkBox" hidden>
      <label>Page link<input id="linkUrl" type="url" placeholder="https://..."></label>
      <label class="check"><input id="saveSite" type="checkbox"> Save this link as a site</label>
      <label>Site name<input id="siteName" placeholder="e.g. Careers page"></label>
    </div>
    <p class="note">Leave any filter empty to use no filter.</p>
    <label>Keyword (optional)<input id="fKeyword" placeholder="e.g. audit"></label>
    <div id="otOnly">
      <label>Category (OpenTrain only)<input id="fCategory"></label>
      <label>Domain (OpenTrain only)<input id="fDomain"></label>
      <label>Language (OpenTrain only), such as en<input id="fLanguage"></label>
      <label>Country (OpenTrain only), two letters such as US<input id="fCountry" maxlength="2"></label>
      <label>Pay type (OpenTrain only)<select id="fPay"><option value="">Any</option><option>PAY_PER_HOUR</option><option>FIXED_PRICE</option><option>PAY_PER_LABEL</option></select></label>
    </div>
    <button id="runBtn">Run</button>
    <div class="msg" id="runMsg"></div>
  </div>
  <div class="card">
    <div class="row"><strong>Latest runs</strong><button class="ghost" id="refresh">Refresh</button></div>
    <div id="runs" style="margin-top:10px"><div class="msg">Loading...</div></div>
  </div>
</div>

<h2 id="resultsTitle" hidden>Results</h2>
<div id="results"></div>

<script>
const API = '/api';
let password = sessionStorage.getItem('dashboardPassword') || '';
const $ = id => document.getElementById(id);

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => {
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else n.setAttribute(k, v);
  });
  kids.forEach(k => n.append(k));
  return n;
}
function safeLink(url, text) {
  const a = el('a', { text: text || url });
  if (/^https?:\/\//.test(url)) { a.href = url; a.target = '_blank'; a.rel = 'noopener'; }
  return a;
}
function ago(iso) {
  if (!iso) return '';
  const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString();
}

async function getFile(path) {
  const r = await fetch(`${API}/feed-file?path=${encodeURIComponent(path)}`, { cache: 'no-store', headers: { 'x-dashboard-password': password } });
  if (r.status === 401) throw 401;
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('Could not load ' + path);
  return r.json();
}
async function post(path, body) {
  const r = await fetch(`${API}/${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password, ...body }) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

/* ---------- outstanding ---------- */
async function loadOutstanding() {
  const box = $('outstanding'); box.replaceChildren(el('div', { class: 'msg', text: 'Loading...' }));
  const data = await getFile('feed/outstanding.json');
  box.replaceChildren();
  if (!data) { box.append(el('div', { class: 'msg', text: 'Nothing loaded yet. It appears after the next run.' })); return; }
  const make = (item, label) => {
    const btn = el('button', { class: 'ghost', text: 'Retry' });
    const msg = el('div', { class: 'msg' });
    btn.onclick = async () => {
      btn.disabled = true; msg.textContent = 'Starting...';
      try { const d = await post('retry', { kind: item.kind, url: item.url }); msg.textContent = d.message; }
      catch (e) { msg.textContent = e.message; msg.className = 'msg err'; }
      btn.disabled = false;
    };
    return el('div', { class: 'card' },
      el('div', { class: 'row' },
        el('div', {}, el('div', { class: 'title', text: item.title || 'Job' }),
          el('div', { class: 'meta', text: [item.company, label].filter(Boolean).join(' · ') })),
        btn),
      el('div', { class: 'meta' }, safeLink(item.url, 'Job link')),
      msg);
  };
  if (!data.letters.length && !data.sends.length) box.append(el('div', { class: 'msg', text: 'Nothing waiting.' }));
  data.sends.forEach(s => box.append(make(s, 'Email failed')));
  if (data.letters_total) box.append(el('p', { class: 'note', text: `${data.letters_total} cover letter(s) waiting. Showing the first ${data.letters.length}, fewest failed tries first.` }));
  data.letters.forEach(l => box.append(make(l, `Score ${l.score} · tries failed: ${l.tries_failed}`)));
}

/* ---------- sites ---------- */
async function loadSites() {
  const sites = (await getFile('feed/sites.json')) || [];
  $('siteSelect').replaceChildren(...sites.map(s => el('option', { value: s.id, text: s.name })));
}

/* ---------- run form ---------- */
function syncMode() {
  const link = $('mode').value === 'link';
  $('siteBox').hidden = link; $('linkBox').hidden = !link; $('otOnly').hidden = link;
}
$('mode').onchange = syncMode;
$('saveSite').onchange = () => {};

$('runBtn').onclick = async () => {
  const link = $('mode').value === 'link';
  const body = {
    mode: link ? 'link' : 'site',
    site_id: $('siteSelect').value,
    link_url: $('linkUrl').value.trim(),
    save_site: $('saveSite').checked,
    site_name: $('siteName').value.trim(),
    keyword: $('fKeyword').value.trim(),
    category: $('fCategory').value.trim(), domain: $('fDomain').value.trim(),
    language: $('fLanguage').value.trim(), country: $('fCountry').value.trim(),
    pay_type: $('fPay').value,
  };
  const msg = $('runMsg'); msg.className = 'msg'; msg.textContent = 'Starting...';
  $('runBtn').disabled = true;
  try {
    const d = await post('run', body);
    msg.textContent = d.message;
    pollRuns();
  } catch (e) { msg.textContent = e.message; msg.className = 'msg err'; }
  $('runBtn').disabled = false;
};

/* ---------- results ---------- */
async function loadRuns() {
  const box = $('runs');
  const index = (await getFile('feed/runs/index.json')) || [];
  box.replaceChildren();
  if (!index.length) { box.append(el('div', { class: 'msg', text: 'No runs yet.' })); return; }
  index.forEach(r => box.append(el('div', { class: 'card' },
    el('div', { class: 'row' },
      el('div', {}, el('div', { class: 'title', text: `${r.site || 'Search'}` }),
        el('div', { class: 'meta', text: `${ago(r.created)} · ${r.count} job(s)${r.blocked ? ' · ' + r.blocked + ' blocked' : ''}` })),
      el('button', { class: 'ghost', text: 'Open', onclick: () => showRun(r.id) }))
  )));
}
async function showRun(id) {
  const data = await getFile(`feed/runs/${id}.json`);
  const box = $('results'); box.replaceChildren();
  $('resultsTitle').hidden = false;
  if (!data) { box.append(el('div', { class: 'msg', text: 'That run is not ready yet.' })); return; }
  box.append(el('div', { class: 'card' },
    el('div', { class: 'title', text: data.site || 'Search' }),
    el('div', { class: 'meta', text: ago(data.created) }),
    el('p', { class: 'note', text: data.note }),
    el('div', { class: 'meta', text: Object.keys(data.filters || {}).length ? 'Filters: ' + Object.entries(data.filters).map(([k, v]) => `${k} = ${v}`).join(', ') : 'No filters' })));
  if (!data.jobs.length) box.append(el('div', { class: 'msg', text: 'No jobs found.' }));
  data.jobs.forEach(j => box.append(el('div', { class: 'card' },
    el('div', { class: 'title' }, j.title, j.blocked ? el('span', { class: 'tag blocked', text: 'Blocked: ' + j.blocked_reason }) : ''),
    el('div', { class: 'meta', text: `Pay: ${j.pay} · Countries: ${j.countries}` }),
    el('div', { class: 'meta' }, safeLink(j.url)))));
}
$('refresh').onclick = loadRuns;
let pollTimer = null;
function pollRuns() {
  clearTimeout(pollTimer);
  let tries = 0;
  const tick = async () => { await loadRuns(); if (++tries < 30) pollTimer = setTimeout(tick, 20000); };
  pollTimer = setTimeout(tick, 60000);
}

/* ---------- start ---------- */
$('unlock').onclick = () => { password = $('pw').value; sessionStorage.setItem('dashboardPassword', password); start(); };
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('unlock').click(); });

async function start() {
  try {
    $('lock').hidden = true;
    syncMode();
    await Promise.all([loadSites(), loadOutstanding(), loadRuns()]);
  } catch (e) {
    if (e === 401) {
      sessionStorage.removeItem('dashboardPassword'); password = '';
      $('lockMsg').textContent = 'Wrong password.'; $('lock').hidden = false;
    } else { $('runMsg').textContent = 'Could not load. Try again.'; }
  }
}
if (password) start(); else $('lock').hidden = false;
</script>
</body></html>
