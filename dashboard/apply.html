<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Apply to a job</title>
<style>
:root{--ink:#000;--paper:#FFFBF1}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);margin:0;padding:18px;font-size:16px;line-height:1.45}
h1{font-size:24px;margin:0 0 12px} a{color:var(--ink);font-weight:600}
form{display:flex;flex-direction:column;gap:14px;max-width:560px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:rgba(0,0,0,.6)}
input,textarea{background:var(--paper);color:var(--ink);border:0;border-radius:16px;padding:12px;font-size:16px;font-family:inherit;box-shadow:inset 5px 5px 10px rgba(0,0,0,.10),inset -5px -5px 10px #fff}
textarea{min-height:140px}
button{border:0;border-radius:16px;padding:14px;font-size:17px;font-weight:600;color:var(--paper);background:linear-gradient(#262626,#000);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 12px rgba(0,0,0,.25);cursor:pointer}
button:disabled{opacity:.5}
#result,.step{padding:14px;border-radius:22px;max-width:560px;margin-top:12px;background:var(--paper);box-shadow:inset 0 -6px 0 rgba(0,0,0,.06),8px 10px 22px rgba(0,0,0,.12)}
.ok{border-left:6px solid #000}.err{border-left:6px solid #000;font-weight:600}
</style><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job search">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<p><a href="index.html">Back to dashboard</a></p>
<h1>Apply to a job</h1>
<form id="f">
  <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
  <label>Job link<input id="job_url" type="url" placeholder="https://..." required></label>
  <label>Company (optional)<input id="company"></label>
  <label>Contact email (optional, if the posting doesn't show one)<input id="email" type="email"></label>
  <label>Job description (optional, paste if the link won't load)<textarea id="job_description"></textarea></label>
  <button id="run" type="submit">Run</button>
  <button id="test" type="button" style="background:linear-gradient(#444,#111);margin-top:4px">Test Telegram path</button>
</form>
<div id="result" hidden></div>
<div id="steps"></div>
<script>
const form = document.getElementById('f');
const result = document.getElementById('result');
const button = document.getElementById('run');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  button.disabled = true; button.textContent = 'Starting...';
  result.hidden = true;
  const payload = {
    password: document.getElementById('password').value,
    job_url: document.getElementById('job_url').value.trim(),
    company: document.getElementById('company').value.trim(),
    email: document.getElementById('email').value.trim(),
    job_description: document.getElementById('job_description').value.trim(),
  };
  try {
    const res = await fetch('/api/apply', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    result.className = res.ok ? 'ok' : 'err';
    result.textContent = res.ok ? data.message : (data.error || 'Something went wrong.');
  } catch (err) {
    result.className = 'err';
    result.textContent = 'Could not reach the site: ' + err.message;
  }
  result.hidden = false;
  button.disabled = false; button.textContent = 'Run';
});

const testBtn = document.getElementById('test');
const stepsBox = document.getElementById('steps');
testBtn.addEventListener('click', async () => {
  testBtn.disabled = true; testBtn.textContent = 'Testing...';
  stepsBox.innerHTML = '';
  try {
    const res = await fetch('/api/telegram-test', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      stepsBox.innerHTML = '<div class="err" style="padding:12px;border-radius:8px;max-width:560px"></div>';
      stepsBox.firstChild.textContent = data.error || 'Test failed.';
    } else {
      for (const s of data.steps) {
        const box = document.createElement('div');
        box.className = s.ok ? 'ok' : 'err';
        box.style.cssText = 'padding:12px;border-radius:8px;max-width:560px;margin-top:10px';
        box.textContent = (s.ok ? 'PASS  ' : 'FAIL  ') + s.name + ': ' + s.detail;
        stepsBox.appendChild(box);
      }
    }
  } catch (err) {
    stepsBox.textContent = 'Could not reach the site: ' + err.message;
  }
  testBtn.disabled = false; testBtn.textContent = 'Test Telegram path';
});
</script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }</script>
</body></html>
