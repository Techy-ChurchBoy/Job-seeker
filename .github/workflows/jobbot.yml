name: jobbot
on:
  schedule:
    - cron: "0 6,18 * * *"   # twice a day: 7am and 7pm Nigeria time
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: jobbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u jobbot.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
      - run: python -u prepare.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: python -u draft_to_gmail.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
          CANDIDATE_PHONE: ${{ secrets.CANDIDATE_PHONE }}
      - run: python -u alert.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
          CANDIDATE_PHONE: ${{ secrets.CANDIDATE_PHONE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python -u greenhouse_apply.py
        env:
          AUTO_SUBMIT: ${{ vars.AUTO_SUBMIT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
          CANDIDATE_PHONE: ${{ secrets.CANDIDATE_PHONE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      - run: python -u send_applications.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
          CANDIDATE_PHONE: ${{ secrets.CANDIDATE_PHONE }}
      - run: python -u dashboard.py
        if: always()
      - name: Save results
        if: always()
        run: |
          git config user.name "jobbot"
          git config user.email "jobbot@users.noreply.github.com"
          for p in matches.csv seen.json prepared.json applied.csv alerted.json applied_forms.json gmail_drafts.json status.json applications cv dashboard; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --staged --quiet || git commit -m "update matches and drafts"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && break
            echo "push was rejected, retrying in 10 seconds"; sleep 10
          done
