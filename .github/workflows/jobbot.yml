name: jobbot
on:
  schedule:
    - cron: "0 6,18 * * *"   # twice a day: 7am and 7pm Nigeria time
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write
  actions: read

concurrency:
  group: jobbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GEMINI_KEY_SCORING: ${{ secrets.GEMINI_KEY_SCORING }}
      GEMINI_KEY_LETTERS: ${{ secrets.GEMINI_KEY_LETTERS }}
      GEMINI_KEY_DEADLINES: ${{ secrets.GEMINI_KEY_DEADLINES }}
      GEMINI_KEY_WEB_SEARCH: ${{ secrets.GEMINI_KEY_WEB_SEARCH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u jobbot.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
      - run: python -u prepare.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: python -u draft_to_gmail.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
          CANDIDATE_PHONE: ${{ secrets.CANDIDATE_PHONE }}
      - run: python -u replies.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - run: python -u alert.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
          CANDIDATE_PHONE: ${{ secrets.CANDIDATE_PHONE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python -u direct_apply.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python -u greenhouse_apply.py
        env:
          AUTO_SUBMIT: ${{ vars.AUTO_SUBMIT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
          CANDIDATE_PHONE: ${{ secrets.CANDIDATE_PHONE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      - run: python -u send_applications.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
          CANDIDATE_PHONE: ${{ secrets.CANDIDATE_PHONE }}
      - run: python -u dashboard.py
        if: always()
      - name: Save results
        if: always()
        run: |
          git config user.name "jobbot"
          git config user.email "jobbot@users.noreply.github.com"
          for p in matches.csv seen.json prepared.json applied.csv alerted.json applied_forms.json gmail_drafts.json failed_sends.json replies.json needs_attention.json direct_apply.json skip_companies.json skills_report.txt skills_report_sent.json productivity_state.json followups_done.json deadlines.json tracker.json usage.jsonl postings.json opentrain_seen.json applications/prep status.json applications cv documents dashboard feed; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --staged --quiet || git commit -m "update matches and drafts"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && break
            echo "push was rejected, retrying in 10 seconds"; sleep 10
          done
      - run: python -u generic_apply.py
        env:
          AUTO_SUBMIT: ${{ vars.AUTO_SUBMIT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
          CANDIDATE_PHONE: ${{ secrets.CANDIDATE_PHONE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      - run: python -u productivity.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: python -u opentrain_scout.py
        env:
          OPENTRAIN_API_KEY: ${{ secrets.OPENTRAIN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python -u skills_report.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - name: Notify on Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(python3 notify_run.py)
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
