name: jobbot
on:
  schedule:
    - cron: "0 6 * * *"   # every day, 6am UTC (7am Nigeria)
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python jobbot.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
      - name: Save results
        run: |
          git config user.name "jobbot"
          git config user.email "jobbot@users.noreply.github.com"
          git add matches.csv seen.json
          git diff --staged --quiet || git commit -m "update matches"
          git push
