name: location-search
on:
  workflow_dispatch:
    inputs:
      location:
        description: Town or area, for example Ibadan
        required: true
      categories:
        description: Kinds of organisation (optional)
        required: false

permissions:
  contents: write

concurrency:
  group: jobbot
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u locate.py
        env:
          LOCATION: ${{ inputs.location }}
          CATEGORIES: ${{ inputs.categories }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
          CANDIDATE_PHONE: ${{ secrets.CANDIDATE_PHONE }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      - run: python -u dashboard.py
      - name: Save results
        run: |
          git config user.name "jobbot"
          git config user.email "jobbot@users.noreply.github.com"
          for p in outreach dashboard; do [ -e "$p" ] && git add "$p"; done
          git diff --staged --quiet || git commit -m "location batch"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 10; done
