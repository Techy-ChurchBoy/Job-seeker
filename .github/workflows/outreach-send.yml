name: outreach-send
on:
  workflow_dispatch:
    inputs:
      batch:
        description: Batch file name
        required: true
      ids:
        description: Comma-separated organisation ids to send
        required: true

permissions:
  contents: write

concurrency:
  group: jobbot
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u outreach_send.py
        env:
          BATCH: ${{ inputs.batch }}
          IDS: ${{ inputs.ids }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CANDIDATE_NAME: ${{ secrets.CANDIDATE_NAME }}
          CANDIDATE_PHONE: ${{ secrets.CANDIDATE_PHONE }}
      - run: python -u dashboard.py
      - name: Save results
        run: |
          git config user.name "jobbot"
          git config user.email "jobbot@users.noreply.github.com"
          for p in outreach outreach_sent.csv dashboard feed; do [ -e "$p" ] && git add "$p"; done
          git diff --staged --quiet || git commit -m "outreach sends"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 10; done
